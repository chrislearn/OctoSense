[package]
name = "octosense-liyu"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
makepad-widgets = { git = "https://github.com/OctoSense-org/makepad.git", rev = "d4502ef1e4d196d2829a07aa137740cb0581e9b4" }
makepad-app-module = { git = "https://github.com/OctoSense-org/makepad.git", rev = "d4502ef1e4d196d2829a07aa137740cb0581e9b4" }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
# 头像工坊: 本地头像解码/校正/编码。版本与主仓 Cargo.lock 中已锁定的
# image 0.25.10 对齐(png + zune-jpeg + image-webp 均已在 lock 中),
# 不需要更新锁文件;EXIF orientation 由 avatar.rs 手写解析,无额外依赖。
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
